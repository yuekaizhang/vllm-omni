# CosyVoice3 deploy — talker on GPU 0, THREE code2wav replicas on GPU 1/2/3 (1:3).
#
# Scales the stage-split idea to a 1:3 talker:code2wav ratio. code2wav decodes
# batch=1 per request and is the serial bottleneck; the earlier 2-replicas-on-one-
# GPU experiment (cosyvoice3_2gpu_2rep.yaml) showed no gain because the two
# replicas still shared one GPU's SMs. Here each of the three code2wav replicas
# gets its OWN GPU (1/2/3), so they decode truly in parallel while the single
# talker on GPU 0 feeds them.
#
# Replica device placement (split_devices_for_replicas, legacy/pool mode):
# stage 1 tp_size=1, num_replicas=3, devices "1,2,3" => len == num_replicas*tp_size
# == 3, so each entry is one replica's device (logical index into the launcher's
# CUDA_VISIBLE_DEVICES). Launch with CUDA_VISIBLE_DEVICES=0,1,2,3 so logical
# 1/2/3 -> physical GPU 1/2/3.
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0,1,2,3 vllm serve FunAudioLLM/Fun-CosyVoice3-0.5B-2512 \
#     --omni --deploy-config vllm_omni/deploy/cosyvoice3_4gpu_3rep.yaml
async_chunk: true
dtype: float32

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 15
      codec_left_context_frames: 25
      codec_vocab_size: 6561

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 8
    gpu_memory_utilization: 0.7
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      max_tokens: 2048
      top_k: 25
      top_p: 0.8
      # near-identity repetition penalty forces vLLM to track
      # output_token_ids for RAS (stop-token logit logsumexp).
      repetition_penalty: 1.0001
    disable_hybrid_kv_cache_manager: true
    mm_processor_cache_gb: 0
    skip_mm_profiling: true

  - stage_id: 1
    num_replicas: 3
    max_num_batched_tokens: 32768
    max_num_seqs: 8
    gpu_memory_utilization: 0.5
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    max_model_len: 32768
    # Three replicas, one per GPU: logical 1/2/3 -> physical GPU 1/2/3 under
    # CUDA_VISIBLE_DEVICES=0,1,2,3. Legacy/pool mode: one device id per replica.
    devices: "1,2,3"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      max_tokens: 2048
    disable_hybrid_kv_cache_manager: true
    skip_mm_profiling: true
